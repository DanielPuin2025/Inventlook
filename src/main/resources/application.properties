spring.application.name=inventlook

# CONEXIÓN A MYSQL inventlook
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventlook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# PUERTO
server.port=${PORT:8080}

#CONFIGURACIÓN NUEVA: ENVÍO DE CORREOS ELECTRÓNICOS

# Servidor de correo saliente de Gmail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
# Puerto seguro para envío de correos
spring.mail.port=${MAIL_PORT:587}
# Correo que va a ENVIAR los mensajes 
spring.mail.username=${MAIL_USERNAME:}
# Contraseña de aplicación de Gmail 
spring.mail.password=${MAIL_PASSWORD:}
# Habilitar seguridad
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
