<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventLook - Inventario Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F0F4F9 0%, #E6EDF7 100%);
            position: relative;
            overflow: hidden;
        }
        /* Efectos de fondo suaves igual a tu imagen */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(30, 95, 140, 0.05);
        }
        body::before { top: -150px; left: -150px; }
        body::after { bottom: -150px; right: -150px; }
        .contenedor-principal {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
        }
        .logo-principal {
            width: 320px;
            height: auto;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .titulo-app {
            font-size: 5rem;
            font-weight: 700;
            color: #1E5F8C;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .subtitulo-app {
            font-size: 1.5rem;
            color: #64748B;
            font-weight: 400;
            margin-bottom: 50px;
        }
        .btn-inicio {
            padding: 16px 70px;
            font-size: 1.6rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(180deg, #2B83F6 0%, #1E5F8C 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 95, 140, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-inicio:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(30, 95, 140, 0.35);
            background: linear-gradient(180deg, #1E5F8C 0%, #164A70 100%);
        }
        /* Ajuste para pantallas pequeñas */
        @media (max-width: 768px) {
            .titulo-app { font-size: 3rem; }
            .logo-principal { width: 220px; }
            .btn-inicio { padding: 14px 50px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <!-- Aquí coloca tu logo: guarda la imagen en src/main/resources/static/img/logo-principal.png -->
        <img th:src="@{/img/logo-principal.png.png}" alt="Logo InventLook" class="logo-principal">
        <h1 class="titulo-app">InventLook</h1>
        <p class="subtitulo-app">Inventario Digital</p>
        <!-- ✅ CORREGIDO: Ahora lleva a INICIAR SESIÓN, NO a registro -->
        <a th:href="@{/login}" class="btn-inicio">INICIO</a>
    </div>
</body>
</html>
